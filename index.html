<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Joyeux 18 ans, Constantin</title>
<meta name="description" content="Claude a quelque chose à te dire. De la part de Hugo.">

<meta property="og:type" content="website">
<meta property="og:title" content="Joyeux 18 ans, Constantin">
<meta property="og:description" content="Claude a quelque chose à te dire. De la part de Hugo.">
<meta property="og:image" content="https://c22.hczr.ch/img/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%23141413'/%3E%3Cg stroke='%23d97757' stroke-width='11' stroke-linecap='round'%3E%3Cpath d='M50 18v64M18 50h64M27 27l46 46M73 27L27 73'/%3E%3C/g%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root {
  --page: #1b1a1f;
  --clay: #d97757;
  --ink: #26297a;
  --w: min(360px, 90vw, calc((100dvh - 64px) * .61));
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; height: 100%; background: var(--page); overflow: hidden; }
body {
  display: grid; place-items: center; align-content: center; gap: 12px;
  padding: max(10px, env(safe-area-inset-top)) 10px max(10px, env(safe-area-inset-bottom));
  font-family: -apple-system, system-ui, sans-serif;
  -webkit-user-select: none; user-select: none; touch-action: manipulation;
  background: radial-gradient(600px 420px at 50% 30%, #2a2733, var(--page) 70%);
}
button { font: inherit; }

.gb {
  width: var(--w); aspect-ratio: 90 / 148; position: relative;
  background: linear-gradient(160deg, #dedad5, #c4c0ba);
  border-radius: 12px 12px calc(var(--w) * .16) 12px;
  box-shadow: inset -5px -7px 0 rgba(0,0,0,.12), inset 3px 3px 0 rgba(255,255,255,.7), 0 40px 80px -20px rgba(0,0,0,.8);
  padding: calc(var(--w) * .07) calc(var(--w) * .07) 0;
  cursor: pointer;
}
.gb.shake { animation: shake .35s cubic-bezier(.36,.07,.19,.97); }
@keyframes shake { 20%, 60% { transform: translate(-4px, 1px) rotate(-.6deg); } 40%, 80% { transform: translate(4px, -1px) rotate(.6deg); } }

.gb-power {
  all: unset; cursor: pointer; position: absolute; top: calc(var(--w) * .018); left: calc(var(--w) * .08);
  font: 800 calc(var(--w) * .024)/1 -apple-system, system-ui, sans-serif; letter-spacing: .08em; color: #8f8b86;
  display: flex; align-items: center; gap: 6px; padding: 4px 0;
}
.gb-power i { display: inline-block; width: calc(var(--w) * .07); height: calc(var(--w) * .022); border-radius: 3px; background: #a9a5a0; position: relative; box-shadow: inset 1px 1px 2px rgba(0,0,0,.35); }
.gb-power i::after { content: ""; position: absolute; top: 0; bottom: 0; width: 45%; right: 0; border-radius: 3px; background: #6f6c68; transition: right .2s; }
.gb-power.off i::after { right: 55%; }

.gb-bezel { position: relative; background: #5a586b; border-radius: 8px 8px calc(var(--w) * .1) 8px; padding: calc(var(--w) * .045) calc(var(--w) * .1) calc(var(--w) * .08); }
.gb-top { display: flex; align-items: center; justify-content: center; color: #b9b6c8; font: 700 calc(var(--w) * .026)/1 -apple-system, system-ui, sans-serif; letter-spacing: .1em; margin-bottom: calc(var(--w) * .04); white-space: nowrap; }
.led { position: absolute; left: calc(var(--w) * .035); top: 46%; width: 7px; height: 7px; border-radius: 50%; background: #3b1b1b; }
.led.on { background: #ff3b3b; box-shadow: 0 0 10px #ff3b3b; }
.screen { position: relative; }
#gbscreen { display: block; width: 100%; aspect-ratio: 160 / 144; image-rendering: pixelated; image-rendering: crisp-edges; background: #7b8a63; box-shadow: inset 0 0 0 1px rgba(0,0,0,.3); touch-action: none; }
.ov { position: absolute; inset: 0; background: #081820; display: none; }
.ov.on { display: block; }
.ov img { width: 100%; height: 100%; object-fit: contain; display: block; }
#ov-video .vid { position: absolute; inset: 0; }
#ov-video iframe { width: 100%; height: 100%; border: 0; display: block; }
.ov-btn { all: unset; cursor: pointer; position: absolute; z-index: 2; font: 8px/1 "Press Start 2P", monospace; color: #081820; background: #e0f8d0; padding: 6px 7px; border: 2px solid #081820; }
.ov-close { top: 4px; right: 4px; }
.ov-unmute { left: 50%; bottom: 8px; transform: translateX(-50%); }
.ov-unmute[hidden] { display: none; }

.gb-logo { margin: calc(var(--w) * .035) 0 0 2px; color: var(--ink); font: italic 800 calc(var(--w) * .062)/1 -apple-system, system-ui, sans-serif; letter-spacing: -.01em; display: flex; align-items: center; gap: 6px; }
.gb-logo b { font-weight: 900; letter-spacing: .02em; }
#star { all: unset; cursor: pointer; color: var(--clay); font-style: normal; display: inline-block; }
#star.wild { animation: spin .5s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

.gb-ctrl { display: flex; justify-content: space-between; align-items: center; margin-top: calc(var(--w) * .09); }
.dpad { position: relative; width: calc(var(--w) * .27); aspect-ratio: 1; }
.dpad i { position: absolute; background: #2d2d35; border-radius: 4px; box-shadow: inset -2px -2px 0 rgba(0,0,0,.4); pointer-events: none; }
.dpad i:nth-child(1) { left: 33%; top: 0; width: 34%; height: 100%; }
.dpad i:nth-child(2) { top: 33%; left: 0; height: 34%; width: 100%; }
.dpad button { all: unset; cursor: pointer; position: absolute; width: 34%; height: 34%; z-index: 1; border-radius: 4px; }
.dpad button:active { background: rgba(0,0,0,.25); }
.dpad [data-b=UP] { left: 33%; top: 0; }
.dpad [data-b=DOWN] { left: 33%; bottom: 0; }
.dpad [data-b=LEFT] { left: 0; top: 33%; }
.dpad [data-b=RIGHT] { right: 0; top: 33%; }
.ab { display: flex; gap: calc(var(--w) * .05); transform: rotate(-25deg); margin-right: 2%; }
.ab button { all: unset; cursor: pointer; width: calc(var(--w) * .135); aspect-ratio: 1; border-radius: 50%; background: #9b2457; box-shadow: inset -3px -4px 0 rgba(0,0,0,.25), 0 3px 0 rgba(0,0,0,.18); position: relative; }
.ab button::after { content: attr(data-b); position: absolute; top: 112%; left: 50%; transform: translateX(-50%); color: var(--ink); font: 800 calc(var(--w) * .035)/1 -apple-system, system-ui, sans-serif; }
.ab button:active, .ab button.down { transform: translateY(2px); box-shadow: inset -2px -2px 0 rgba(0,0,0,.25); }
.gb-ss { display: flex; justify-content: center; gap: calc(var(--w) * .07); margin-top: calc(var(--w) * .09); margin-right: 14%; }
.gb-ss button { all: unset; cursor: pointer; width: calc(var(--w) * .13); height: calc(var(--w) * .028); border-radius: 99px; background: #85838f; transform: rotate(-25deg); position: relative; box-shadow: inset -1px -2px 0 rgba(0,0,0,.25); }
.gb-ss button::before { content: ""; position: absolute; inset: -12px -4px; }
.gb-ss button::after { content: attr(data-b); position: absolute; top: 260%; left: 50%; transform: translateX(-50%); color: var(--ink); font: 800 calc(var(--w) * .026)/1 -apple-system, system-ui, sans-serif; letter-spacing: .1em; }
.gb-ss button:active { background: #6c6a75; }
.gb-speaker { position: absolute; right: 8%; bottom: 5%; display: flex; gap: calc(var(--w) * .022); transform: rotate(-28deg); pointer-events: none; }
.gb-speaker i { width: calc(var(--w) * .016); height: calc(var(--w) * .13); border-radius: 4px; background: #a8a49f; box-shadow: inset 1px 1px 2px rgba(0,0,0,.4); }

.hint { margin: 0; min-height: 14px; color: #cfcbe0; font: 9px/1.5 "Press Start 2P", monospace; letter-spacing: .04em; text-align: center; max-width: var(--w); }
.hint.blink { animation: blink 1.1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.skip { all: unset; cursor: pointer; color: #6f6c80; font: 8px "Press Start 2P", monospace; padding: 4px 8px; }
.skip[hidden] { display: none; }
</style>
</head>
<body>
<div class="gb" id="gb">
  <button class="gb-power" id="power" type="button" aria-label="Interrupteur"><i></i>OFF·ON</button>
  <div class="gb-bezel">
    <div class="gb-top">CLAUDE CODE · DOT MATRIX · 18</div>
    <span class="led" id="led"></span>
    <div class="screen">
      <canvas id="gbscreen" width="160" height="144" aria-label="Écran du jeu"></canvas>
      <div class="ov" id="ov-photo"><img id="ov-img" alt=""></div>
      <div class="ov" id="ov-video"><div class="vid"><div id="yt"></div></div><button class="ov-btn ov-close" id="ov-close" type="button">B ✕</button><button class="ov-btn ov-unmute" id="ov-unmute" type="button" hidden>SON ON</button></div>
    </div>
  </div>
  <div class="gb-logo"><button id="star" type="button" aria-label="Étoile">✻</button> Claude <b>BOY</b></div>
  <div class="gb-ctrl">
    <div class="dpad"><i></i><i></i>
      <button type="button" data-b="UP" aria-label="Haut"></button><button type="button" data-b="DOWN" aria-label="Bas"></button>
      <button type="button" data-b="LEFT" aria-label="Gauche"></button><button type="button" data-b="RIGHT" aria-label="Droite"></button>
    </div>
    <div class="ab"><button type="button" data-b="B" aria-label="B"></button><button type="button" data-b="A" aria-label="A"></button></div>
  </div>
  <div class="gb-ss"><button type="button" data-b="SELECT" aria-label="Select"></button><button type="button" data-b="START" aria-label="Start"></button></div>
  <div class="gb-speaker" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
</div>
<p class="hint blink" id="hint">Appuie sur START</p>
<button class="skip" id="skip" type="button" hidden>aller au chat</button>
<script src="game.js"></script>
</body>
</html>
